<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Cache-busted with ?v=2 — same reason as the gift logos in
      src/components/Hero.jsx: these are served with a 1-year Cache-Control
      at a stable filename, so re-cutting the image bytes doesn't reach
      anyone who already has the old one. Without this, every returning
      visitor would keep the previous black-square icon for up to a year.
      The manifest is versioned too, or its own cached copy would keep
      pointing at the unversioned icon URLs.
      Bump the version again whenever these icons are regenerated.
    -->
    <link rel="icon" type="image/png" href="/assets/icons/favicon-96x96.png?v=2" sizes="96x96" />
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/web-app-manifest-192x192.png?v=2" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/web-app-manifest-512x512.png?v=2" />
<link rel="shortcut icon" href="/assets/icons/favicon.ico?v=2" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=2" />
<link rel="manifest" href="/assets/icons/site.webmanifest?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Baseline SEO / social tags.

      data-rh="true" hands ownership of these specific tags to
      react-helmet-async: it only replaces tags carrying that attribute,
      so without it every route would end up with TWO canonicals and two
      og:title tags — the static one below plus Helmet's. Only tags that
      Seo.jsx also emits are marked; anything else marked here would be
      deleted on Helmet's first commit.

      react-helmet-async rewrites all of these per route at runtime (see
      src/components/RouteSeo.jsx), but only for clients that execute JS.
      Social scrapers — WhatsApp, Telegram, Slack, LinkedIn, Discord — read
      the raw HTML and never run React, so whatever sits here is exactly
      what a shared link previews as. Keep these values in step with the
      defaults in src/config/seo.js.
    -->
    <title>JackpotsWorld — Asia's #1 Offline Casino VIP Platform</title>
    <meta data-rh="true" name="description" content="Premium offline casino packages across Vietnam, Macau, India, Sri Lanka and the Philippines. VIP travel, exclusive tournaments and world-class gaming. Register free." />
    <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0A0005" />

    <meta data-rh="true" property="og:site_name" content="JackpotsWorld" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:title" content="JackpotsWorld — Asia's #1 Offline Casino VIP Platform" />
    <meta data-rh="true" property="og:description" content="Premium offline casino packages across Vietnam, Macau, India, Sri Lanka and the Philippines. VIP travel, exclusive tournaments and world-class gaming. Register free." />
    <meta data-rh="true" property="og:image" content="https://jackpotsworld.vip/assets/icons/web-app-manifest-512x512.png" />
    <meta property="og:locale" content="en_US" />

    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="JackpotsWorld — Asia's #1 Offline Casino VIP Platform" />
    <meta data-rh="true" name="twitter:description" content="Premium offline casino packages across Vietnam, Macau, India, Sri Lanka and the Philippines. VIP travel, exclusive tournaments and world-class gaming. Register free." />
    <meta data-rh="true" name="twitter:image" content="https://jackpotsworld.vip/assets/icons/web-app-manifest-512x512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-DYQ-rwV0.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DUm68vmE.css">
  </head>
  <body>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('w365-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </body>
</html>
