# LIVE-CHAT: adds a /ws/ location to Elastic Beanstalk's generated nginx
# server block, proxying WebSocket traffic to the separate `websocket`
# process from Procfile (daphne, port 8001) instead of the normal `web`
# process (gunicorn/WSGI, port 8000) that handles every other route.
#
# This is purely additive — every existing route keeps going through the
# EB-managed proxy to port 8000 exactly as before this feature existed.
# cPanel/Passenger has no nginx layer and never reads this file; that
# deployment simply has no /ws/ route, and the frontend falls back to
# polling in that case (see src/services/liveChatSocket.js).
#
# EB's Python/Amazon Linux platforms include files under
# .platform/nginx/conf.d/elasticbeanstalk/*.conf inside the same `server {}`
# block used for the main app, so a bare `location` block (no `server {}`
# wrapper) is correct here. Re-verify this include path against the
# platform version in use if a future platform upgrade changes it.
location /ws/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
