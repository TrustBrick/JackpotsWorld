# Elastic Beanstalk's Amazon Linux 2023 nginx proxy defaults
# client_max_body_size to 1m, which silently 413s any admin-panel media
# upload (Destination Media images/videos, KYC docs, etc.) past that size
# before the request ever reaches Django. Raised to cover the video/image
# uploads used by the Destination Media admin tool.
#
# See websocket.conf in this same directory for why a bare directive (no
# `server {}` wrapper) is correct here — EB includes these files inside its
# own generated server block.
client_max_body_size 100M;
